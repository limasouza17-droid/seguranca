<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="conteudo">

        <div class="conteudo-titulo">
            <img src="unlock.svg" alt="Cadeado">

            <h1 class="titulo-principal">
                Gerador de Senhas
            </h1>

            <h2 class="titulo-secundario">
                Gere instantaneamente uma senha aleatória e segura
            </h2>
        </div>

        <!-- Campo da senha -->
        <div class="conteudo-senha">

            <label for="campo-senha">
                Senha
            </label>

            <input
                type="text"
                id="campo-senha"
                readonly
                value=""
            >

            <button class="botao-gerar" id="gerar-senha">
                Gerar senha
            </button>

        </div>

        <!-- Parâmetros -->
        <section class="parametro">

            <h2 class="parametro-titulo">
                Personalize sua senha
            </h2>

            <div class="parametro-coluna__senha">

                <!-- Número de caracteres -->
                <div class="parametro-senha">

                    <h3 class="parametro-senha__titulo">
                        Número de caracteres
                    </h3>

                    <div class="parametro-senha-botoes">

                        <button class="parametro-senha__botao" id="diminuir">
                            -
                        </button>

                        <p class="parametro-senha__texto" id="numero-caracteres">
                            12
                        </p>

                        <button class="parametro-senha__botao" id="aumentar">
                            +
                        </button>

                    </div>

                </div>

                <!-- Características -->
                <div class="parametro-senha">

                    <h3 class="parametro-senha__titulo">
                        Características da senha
                    </h3>

                    <label>
                        <input type="checkbox" checked id="maiusculas">
                        Letras maiúsculas
                    </label>

                    <label>
                        <input type="checkbox" checked id="minusculas">
                        Letras minúsculas
                    </label>

                    <label>
                        <input type="checkbox" checked id="numeros">
                        Números
                    </label>

                    <label>
                        <input type="checkbox" id="simbolos">
                        Símbolos
                    </label>

                </div>

                <!-- Força da senha -->
                <div class="parametro-senha">

                    <h3 class="parametro-senha__titulo">
                        Força da senha
                    </h3>

                    <div class="barra-forca">
                        <div id="forca"></div>
                    </div>

                    <!-- Apenas um elemento para o texto -->
                    <p id="texto-forca">Média</p>

                </div>

            </div>

        </section>

    </section>

    <script src="script.js"></script>

</body>

</html>
